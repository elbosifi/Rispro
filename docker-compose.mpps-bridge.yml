services:
  mpps-bridge:
    build:
      context: .
      dockerfile: docker/mpps-bridge/Dockerfile
    container_name: rispro-mpps-bridge
    env_file:
      - .env
    environment:
      MPPS_STORAGE_DIR: /data/dicom/mpps-bridge
    ports:
      - "${MPPS_BRIDGE_PORT:-11113}:${MPPS_BRIDGE_PORT:-11113}"
    volumes:
      - rispro-storage:/data
    healthcheck:
      test: ["CMD-SHELL", "/app/scripts/dicom-gateway/mpps-smoke-test.sh --healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - rispro-network
