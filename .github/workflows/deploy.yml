name: Deploy RISpro Development Target
run-name: Deploy RISpro development ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA that passed comprehensive CI and RISpro self-hosted CI
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: rispro-dev-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy development target
    runs-on:
      - self-hosted
      - Linux
      - X64
      - rispro-ci

    environment: development

    steps:
      - name: Validate deployment commit SHA
        env:
          DEPLOY_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character commit SHA." >&2
            exit 1
          fi

          echo "DEPLOY_SHA=${DEPLOY_SHA,,}" >> "$GITHUB_ENV"

      - name: Require successful comprehensive CI for exact commit
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ inputs.commit_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const expectedSha = process.env.DEPLOY_SHA.toLowerCase();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              head_sha: expectedSha,
              per_page: 100,
            });

            const successfulRun = data.workflow_runs.find((run) =>
              run.head_sha.toLowerCase() === expectedSha &&
              run.status === "completed" &&
              run.conclusion === "success"
            );

            if (!successfulRun) {
              core.setFailed(`No successful RISpro comprehensive CI run exists for ${expectedSha}.`);
              return;
            }

            core.info(`Using successful comprehensive CI run ${successfulRun.id} for ${expectedSha}: ${successfulRun.html_url}`);

      - name: Require successful self-hosted CI for exact commit
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ inputs.commit_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const expectedSha = process.env.DEPLOY_SHA.toLowerCase();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "self-hosted-ci.yml",
              head_sha: expectedSha,
              per_page: 100,
            });

            const successfulRun = data.workflow_runs.find((run) =>
              run.head_sha.toLowerCase() === expectedSha &&
              run.status === "completed" &&
              run.conclusion === "success"
            );

            if (!successfulRun) {
              core.setFailed(`No successful RISpro self-hosted CI run exists for ${expectedSha}.`);
              return;
            }

            core.info(`Using successful self-hosted CI run ${successfulRun.id} for ${expectedSha}: ${successfulRun.html_url}`);

      - name: Verify development server SSH connectivity
        run: |
          ssh \
            -i /home/ci-runner/.ssh/rispro_deploy_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            rispro-deploy@192.9.101.250 \
            'whoami && hostname'

      - name: Check whether requested build is already deployed
        id: deployed-check
        shell: bash
        run: |
          set -u
          precheck_output="$(ssh \
            -i /home/ci-runner/.ssh/rispro_deploy_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            rispro-deploy@192.9.101.250 \
            bash -s -- "${DEPLOY_SHA}" <<'REMOTE_PRECHECK' 2>/dev/null || true
          set -euo pipefail
          expected_sha="$1"
          health_json="$(curl --fail --silent --show-error http://127.0.0.1:3000/api/health)"
          curl --fail --silent --show-error http://127.0.0.1:3000/api/ready >/dev/null
          node - "$expected_sha" "$health_json" <<'NODE_PRECHECK'
          const expectedSha = process.argv[2];
          const health = JSON.parse(process.argv[3]);
          process.stdout.write(health.ok === true && health.buildSha === expectedSha ? "already-deployed" : "needs-deployment");
          NODE_PRECHECK
          REMOTE_PRECHECK
          )"

          if [[ "$precheck_output" == *"already-deployed"* ]]; then
            echo "already_deployed=true" >> "$GITHUB_OUTPUT"
            echo "Requested build is already healthy, ready, and running."
          else
            echo "already_deployed=false" >> "$GITHUB_OUTPUT"
            echo "No matching healthy build was confirmed; deployment will proceed."
          fi

      - name: Deploy RISpro development target
        if: steps.deployed-check.outputs.already_deployed != 'true'
        run: |
          ssh \
            -i /home/ci-runner/.ssh/rispro_deploy_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            rispro-deploy@192.9.101.250 \
            "sudo -n /usr/local/sbin/deploy-rispro-production --expected-sha ${DEPLOY_SHA}"

      - name: Verify post-deployment health and build SHA
        run: |
          ssh \
            -i /home/ci-runner/.ssh/rispro_deploy_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            rispro-deploy@192.9.101.250 \
            bash -s -- "${DEPLOY_SHA}" <<'REMOTE_VERIFY'
          set -euo pipefail
          expected_sha="$1"
          health_json="$(curl --fail --silent --show-error http://127.0.0.1:3000/api/health)"
          curl --fail --silent --show-error http://127.0.0.1:3000/api/ready >/dev/null

          node - "$expected_sha" "$health_json" <<'NODE_VERIFY'
          const expectedSha = process.argv[2];
          const health = JSON.parse(process.argv[3]);

          if (health.ok !== true || health.buildSha !== expectedSha) {
            console.error(`Running build mismatch: expected ${expectedSha}, received ${JSON.stringify(health)}`);
            process.exit(1);
          }

          console.log(`Post-deployment health and build SHA verified: ${expectedSha}`);
          NODE_VERIFY
          REMOTE_VERIFY

      - name: Run post-deployment functional smoke gate
        env:
          RISPRO_SMOKE_AUTH_ENABLED: "false"
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
        run: |
          : "${DEPLOY_APP_DIR:?DEPLOY_APP_DIR GitHub Actions variable is required}"

          ssh \
            -i /home/ci-runner/.ssh/rispro_deploy_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            rispro-deploy@192.9.101.250 \
            bash -s -- "${DEPLOY_SHA}" "${RISPRO_SMOKE_AUTH_ENABLED}" "${DEPLOY_APP_DIR}" <<'REMOTE_SMOKE'
          set -euo pipefail
          expected_sha="$1"
          auth_enabled="$2"
          app_dir="$3"

          if [ ! -d "$app_dir" ]; then
            echo "RISpro deployment directory does not exist: $app_dir" >&2
            exit 1
          fi

          cd "$app_dir"
          RISPRO_SMOKE_BASE_URL="http://127.0.0.1:3000" \
          RISPRO_EXPECTED_COMMIT_SHA="$expected_sha" \
          RISPRO_SMOKE_AUTH_ENABLED="$auth_enabled" \
          npm run test:deployment:smoke
          REMOTE_SMOKE

  report-failure:
    name: Report development deployment failure
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out automation reporting utility
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Create or update failure issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.commit_sha }}
        run: node scripts/ci/development-automation.mjs deployment-report

  close-recovered-failure:
    name: Close recovered deployment failure issue
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out automation reporting utility
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Close matching issue after recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.commit_sha }}
        run: node scripts/ci/development-automation.mjs deployment-recovery
