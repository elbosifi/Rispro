name: Deploy RISpro Dev Server

on:
  workflow_dispatch:

concurrency:
  group: rispro-dev-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy local development server
    runs-on:
      - self-hosted
      - Linux
      - X64
      - rispro-ci

    environment: development

    steps:
      - name: Verify development server SSH connectivity
        run: |
          ssh \
            -i /home/ci-runner/.ssh/rispro_deploy_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            rispro-deploy@192.9.101.250 \
            'whoami && hostname'

      - name: Deploy RISpro development server
        run: |
          ssh \
            -i /home/ci-runner/.ssh/rispro_deploy_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            rispro-deploy@192.9.101.250 \
            'sudo -n /usr/local/sbin/deploy-rispro-production'
