name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Validate agent contract
        run: npm run agent:contract

      - name: Run repository harness
        run: npm run harness:all

      - name: Run deployment-gate regression
        run: npm run test:deployment:gate

  backend-scheduling:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rispro
          POSTGRES_PASSWORD: rispro_password
          POSTGRES_DB: rispro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rispro -d rispro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rispro:rispro_password@localhost:5432/rispro
      JWT_SECRET: ci-test-secret
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python for MPPS bridge tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: npm ci

      - name: Install MPPS bridge test dependencies
        run: python -m pip install -r docker/mpps-bridge/requirements.txt

      - name: Configure DB-backed test environment
        run: |
          cat > codex-db-test.env <<'EOF'
          DATABASE_URL=postgresql://rispro:rispro_password@localhost:5432/rispro
          TEST_DATABASE_URL=postgresql://rispro:rispro_password@localhost:5432/rispro
          PGHOST=localhost
          PGPORT=5432
          PGDATABASE=rispro
          PGUSER=rispro
          PGPASSWORD=rispro_password
          EOF

      - name: Run database migrations
        run: npm run migrate

      - name: Typecheck backend
        run: npm run typecheck

      - name: Run backend unit coverage
        run: npm run test:backend:unit:coverage

      - name: Run backend DB-backed coverage
        run: npm run test:backend:db:coverage

      - name: Merge and enforce backend coverage
        run: npm run coverage:backend:merge

      - name: Write backend coverage summary
        run: node scripts/coverage/write-summary.mjs backend

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend/
          if-no-files-found: ignore

      - name: Run scheduling test gate
        run: npm run test:backend:scheduling-gate

      - name: Run backup v3 DB restore integration
        env:
          BACKUP_V3_DB_RESTORE_INTEGRATION: "1"
        run: npm run test:db:one -- src/services/backup-v3-db-restore.integration.test.ts

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Write frontend coverage summary
        run: node scripts/coverage/write-summary.mjs frontend

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

      - name: Frontend production build
        working-directory: frontend
        run: npm run build -- --mode production && npm run verify:qz-bundle

  browser-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare synthetic E2E environment
        run: |
          cp e2e/.env.example .env
          cp e2e/.env.example e2e/.env

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start guarded disposable E2E database
        run: npm run e2e:db:up

      - name: Run critical browser journeys
        run: npm run test:e2e:ci

      - name: Stop guarded disposable E2E database
        if: always()
        run: npm run e2e:db:down

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
