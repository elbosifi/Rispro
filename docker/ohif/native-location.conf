# Opt-in template rendered by the official nginx entrypoint. Substitute ONLY
# OHIF_NATIVE_AUTH_SECRET (64 hex characters), never nginx's runtime variables.
location /ohif-native/ {
  if ($request_method != GET) { return 405; }
  auth_request /_ohif-native-authorize;
  auth_request_set $ohif_native_origin $upstream_http_x_rispro_orthanc_origin;
  auth_request_set $ohif_native_authorization $upstream_http_x_rispro_orthanc_authorization;
  auth_request_set $ohif_native_path $upstream_http_x_rispro_dicomweb_path;

  # Origin and complete path come ONLY from the successful authorization result.
  # In this deployment Settings points to http://192.9.101.170:8042, never the
  # internal reconciliation Orthanc. No diagnostic bytes traverse Express.
  proxy_pass $ohif_native_origin/dicom-web$ohif_native_path;
  proxy_http_version 1.1;
  proxy_pass_request_headers off;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Host $proxy_host;
  proxy_set_header Connection "";
  proxy_set_header Authorization $ohif_native_authorization;
  proxy_set_header Accept $http_accept;
  proxy_set_header Range $http_range;
  proxy_set_header If-Range $http_if_range;
  proxy_hide_header Authorization;
  proxy_hide_header X-Rispro-Orthanc-Authorization;
  proxy_hide_header X-Rispro-Orthanc-Origin;
  proxy_hide_header X-Rispro-Dicomweb-Path;
  proxy_hide_header Set-Cookie;
  proxy_hide_header WWW-Authenticate;
  proxy_hide_header Cache-Control;
  proxy_hide_header Location;
  proxy_intercept_errors on;
  error_page 301 302 303 307 308 500 502 503 504 =502 @ohif_native_error;
  gzip off;
  proxy_cache off;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  send_timeout 300s;
  access_log off;
  add_header Cache-Control "private, no-store" always;
  add_header X-Content-Type-Options nosniff always;
}

location = /_ohif-native-authorize {
  internal;
  proxy_pass http://rispro_app/api/ohif/native/authorize;
  proxy_method GET;
  proxy_pass_request_body off;
  proxy_pass_request_headers off;
  proxy_set_header Content-Length "";
  proxy_set_header Host $proxy_host;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header X-Rispro-Native-Gateway "${OHIF_NATIVE_AUTH_SECRET}";
  proxy_set_header X-Rispro-Native-Uri $request_uri;
  proxy_set_header X-Rispro-Native-Method $request_method;
  proxy_cache off;
  access_log off;
}

location @ohif_native_error {
  add_header Cache-Control "private, no-store" always;
  return 502;
}
