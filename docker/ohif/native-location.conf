# Mount only after configuring the official Authorization plugin on the archive.
# Adapt this internal upstream to the authoritative Orthanc service; never expose
# its administrative REST API through this location.
location ~ "^/ohif-native/context/(?<ohif_native_context>[a-fA-F0-9-]{36})(?<ohif_native_path>/studies/[0-9.]+(?:/.*)?)$" {
  if ($request_method != GET) { return 405; }
  set $ohif_native_upstream http://orthanc:8042;
  proxy_pass $ohif_native_upstream/dicom-web$ohif_native_path$is_args$args;
  proxy_http_version 1.1;
  proxy_set_header X-Rispro-Viewer "$ohif_native_context|$http_cookie";
  proxy_set_header Authorization "";
  proxy_set_header Cookie "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  gzip off;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  add_header Cache-Control "private, no-store" always;
  add_header X-Content-Type-Options nosniff always;
}
location /ohif-native/ { return 404; }
