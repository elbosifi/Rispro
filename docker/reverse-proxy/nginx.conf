worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_max_body_size 75m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Docker service IPs can change when a container is recreated or restarted.
  # Keep this upstream in shared memory and re-resolve the app service through
  # Docker's embedded DNS so the gateway does not pin a stale container IP.
  upstream rispro_app {
    zone rispro_app 64k;
    server app:3000 resolve;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name _;

    location = /gateway-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location /ohif-dicomweb/ {
      proxy_pass http://rispro_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      send_timeout 300s;
    }

    location = /ohif {
      return 302 /ohif/;
    }

    location /ohif/ {
      set $ohif_upstream http://ohif:80;
      proxy_pass $ohif_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }

    # DICOM remap stages a complete study durably before returning 202. Keep the
    # ordinary API limit below, but stream this exact multipart endpoint so Nginx
    # does not buffer a multi-gigabyte study before RISpro can enforce its own
    # staged-file limits.
    location = /api/pacs/remap/jobs/process-multipart {
      client_max_body_size 21g;
      client_body_timeout 900s;

      proxy_pass http://rispro_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
      send_timeout 900s;
    }

    # Fast verification uses the same durable streaming writer, but stops in
    # awaiting_confirmation before any worker can claim the staged source.
    location = /api/pacs/remap/jobs/stage-multipart {
      client_max_body_size 21g;
      client_body_timeout 900s;

      proxy_pass http://rispro_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
      send_timeout 900s;
    }

    # External Backup V3 archives use resumable, bounded chunks. Keep the
    # normal API limit intact and do not buffer each chunk in Nginx.
    location ~ ^/api/admin/restore/v3/upload-sessions/[0-9a-fA-F-]+/chunks$ {
      client_max_body_size 8m;
      client_body_timeout 120s;

      proxy_pass http://rispro_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      send_timeout 120s;
    }

    location / {
      proxy_pass http://rispro_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }
  }
}
