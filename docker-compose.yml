# =============================================================================
# NCCB Diagnostic Radiology - Docker Compose (Base)
# =============================================================================
# This file defines the core RISpro application service.
# It expects deployment mode variables and DATABASE_URL to be set in the .env file.
#
# For a complete stack with an internal PostgreSQL database, also include
# the override file:
#   docker compose -f docker-compose.yml -f docker-compose.internal-db.yml up -d --build
#
# For an external PostgreSQL database, use this file alone:
#   docker compose up -d --build
# =============================================================================

services:
  # -----------------------------------------------------------------------
# RISpro Application
# -----------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${RISPRO_APP_IMAGE_TARGET:-production}
    image: ${RISPRO_APP_IMAGE:-rispro-app:local}
    container_name: rispro-app
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RISPRO_BUILD_COMMIT_SHA: ${RISPRO_BUILD_COMMIT_SHA:-unknown}
      REQUEST_SCAN_WORKER_PROCESS_ENABLED: "${REQUEST_SCAN_APP_WORKER_ENABLED:-false}"
      REQUEST_SCAN_MAX_CONCURRENCY: "1"
      QZ_TRUST_MODE: ${QZ_TRUST_MODE:-internal_ca}
      QZ_ROOT_CERTIFICATE_FILE: /run/secrets/qz_root_certificate
      QZ_CERTIFICATE_FILE: /run/secrets/qz_signing_certificate
      QZ_PRIVATE_KEY_FILE: /run/secrets/qz_signing_private_key
      QZ_INSTALLER_FILE: /var/lib/rispro/qz-bootstrap/qz-tray-2.2.6-x86_64.exe
    expose:
      - "3000"
    ports:
      - "11112:11112" # Embedded DICOM MWL SCP (used only in embedded mode)
    volumes:
      - rispro-storage:/app/storage
      - ./storage/sante-hl7-outbox:/app/storage/sante-hl7-outbox
      - ./var/qz-bootstrap:/var/lib/rispro/qz-bootstrap:ro
    secrets:
      - qz_root_certificate
      - qz_signing_certificate
      - qz_signing_private_key
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - rispro-network

  request-scan-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${RISPRO_APP_IMAGE_TARGET:-production}
    image: ${RISPRO_APP_IMAGE:-rispro-app:local}
    env_file:
      - .env
    command: ["npm", "run", "start:request-scan-worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RISPRO_SKIP_BOOTSTRAP: "1"
      REQUEST_SCAN_WORKER_PROCESS_ENABLED: "${REQUEST_SCAN_DEDICATED_WORKER_ENABLED:-true}"
      REQUEST_SCAN_MAX_CONCURRENCY: "${REQUEST_SCAN_DEDICATED_MAX_CONCURRENCY:-1}"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - rispro-storage:/app/storage
      - ./storage/sante-hl7-outbox:/app/storage/sante-hl7-outbox
    healthcheck:
      test: ["CMD", "npm", "run", "healthcheck:request-scan-worker"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    cpus: 2
    mem_limit: 3g
    stop_grace_period: 75s
    networks:
      - rispro-network

  ohif:
    profiles: ["ohif"]
    build:
      context: .
      dockerfile: docker/ohif/Dockerfile
      args:
        OHIF_VERSION: ${OHIF_VERSION:-v3.12.6}
    image: ${OHIF_CONTAINER_IMAGE:-rispro-ohif:v3.12.6}
    container_name: rispro-ohif
    volumes:
      - ./docker/ohif/app-config.js:/usr/share/nginx/html/ohif/app-config.js:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/ohif/"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rispro-network

  gateway:
    image: nginx:1.27.5-alpine
    container_name: rispro-gateway
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${RISPRO_WEB_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway-health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - rispro-network

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  rispro-storage:
    driver: local

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
networks:
  rispro-network:
    driver: bridge

secrets:
  qz_root_certificate:
    file: ${QZ_ROOT_CERTIFICATE_HOST_FILE:-./secrets/qz/identity/qz-root-ca.crt}
  qz_signing_certificate:
    file: ${QZ_CERTIFICATE_HOST_FILE:-./secrets/qz/identity/qz-signing-certificate.pem}
  qz_signing_private_key:
    file: ${QZ_PRIVATE_KEY_HOST_FILE:-./secrets/qz/identity/qz-signing-private-key.pem}
